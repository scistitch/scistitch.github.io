name: Build and publish site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Ensure generated output is not tracked
        run: test -z "$(git ls-files _site node_modules)"
      - name: Save public output for publishing
        if: github.repository == 'scistitch/scistitch.github.io' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: public-site
          path: _site/
          include-hidden-files: true
          retention-days: 1

  publish:
    needs: build
    if: github.repository == 'scistitch/scistitch.github.io' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: public-site
          path: _site
      - name: Verify deployable output
        run: |
          test -f _site/index.html
          test -f _site/CNAME
          test -f _site/robots.txt
          test -f _site/sitemap.xml
          grep -qx 'scistitch.com' _site/CNAME
      # GitHub Pages must be configured to use GitHub Actions as its source.
      # Publish _site once; never publish Eleventy templates from main.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live homepage
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 15 https://scistitch.com/ -o /tmp/scistitch-homepage.html &&
              grep -q '<title>SciStitch' /tmp/scistitch-homepage.html; then
              echo "SciStitch homepage is responding with generated HTML"
              exit 0
            fi
            echo "Homepage verification attempt ${attempt} failed; retrying..."
            sleep 10
          done
          echo "Published homepage did not pass availability check"
          exit 1
